<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Sound Studio: Touring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand palette: sampled from the logo */
  --bg:#141414;       /* logo background */
  --panel:#1f1e1c;
  --line:#373431;
  --text:#f4f2ee;
  --muted:#a8a298;    /* 7.3:1 on --bg */
  --tan:#baa17d;      /* logo mark, 7.4:1 on --bg */
  --signal:#eb5933;   /* brand orange, 5.3:1 on --bg */
  --display:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5}
.brand{padding:20px 24px 0}
.brand img{height:44px;width:auto;display:block}
.menu{display:flex;gap:22px;margin-top:14px}
.menu a{color:var(--muted);text-decoration:none;font:500 .9rem var(--body);padding:4px 0;border-bottom:2px solid transparent}
.menu a:hover{color:var(--text)}
.menu a[aria-current="page"]{color:var(--text);border-bottom-color:var(--signal)}
.menu a:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
h1{color:var(--text);font:600 clamp(2.4rem,7vw,5rem)/.95 var(--display);letter-spacing:-.03em;max-width:14ch}
.sub{color:var(--muted);max-width:56ch;margin:16px 0 28px;font-size:1.05rem}
h2{font:600 clamp(1.5rem,3vw,2rem)/1.1 var(--display);letter-spacing:-.02em;margin:48px 0 18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px} /* same as the gap between tiles */
.chip{font:500 .9rem var(--body);color:var(--text);background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer}
.chip:hover{border-color:var(--tan)}
.chip[aria-pressed="true"]{background:var(--tan);color:var(--bg);border-color:var(--tan)}
.chip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);background:var(--panel);border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
.art{aspect-ratio:4/3;position:relative;display:flex;align-items:flex-end;padding:16px;background-size:cover;background-position:center}
.art h3 small{display:block;margin-top:6px;font-size:.55em;font-weight:500;letter-spacing:0;line-height:1.2;opacity:.85}
.art h3{position:relative;font:600 clamp(1.5rem,2.4vw,2rem)/1 var(--display);letter-spacing:-.03em;color:rgba(255,255,255,.92);text-wrap:balance}
.info{padding:14px 16px 18px;display:grid;gap:4px}
.role{color:var(--signal);font-weight:500;font-size:.95rem}
.what{color:var(--muted);font-size:.92rem}
.when{font-size:.88rem}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(180px,1.2fr) 110px minmax(0,2fr) 110px;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row .n{font-weight:500}
.row .r{color:var(--signal);font-size:.92rem}
.row .w{color:var(--muted);font-size:.92rem}
.row .y{text-align:right;font-size:.92rem}
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.start div{border-top:2px solid var(--line);padding-top:10px}
.start b{display:block;font-weight:500}
.start span{color:var(--muted);font-size:.92rem}
.cta{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted)}
.cta a{color:var(--tan);font-weight:500}
.cta a:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.empty{color:var(--muted);padding:24px 0}
@media(max-width:700px){.row{grid-template-columns:1fr auto;gap:2px 12px}.row .r{grid-column:1}.row .y{grid-column:2;grid-row:1}.row .w{grid-column:1/-1}}
</style>
</head>

function byRecent(a,b){return (a.last?1:0)-(b.last?1:0)||b.end-a.end} /* last:true pins an entry to the end */

function renderFilters(){

    const bg=t.photo?`background-image:linear-gradient(transparent 40%,rgba(0,0,0,.7)),url('${t.photo}')`
      :`background:linear-gradient(${a}deg,${c[0]},${c[1]})`;
    return `<article class="card"><div class="art" style="${bg}"><h3>${esc(t.name)}${t.sub?`<small>${esc(t.sub)}</small>`:''}</h3></div>
      <div class="info"><span class="role">${esc(t.role)}</span>${t.what?`<span class="what">${esc(t.what)}</span>`:''}${t.when?`<span class="when">${esc(t.when)}</span>`:''}</div></article>`;
  }).join(''):'<p class="empty">No featured credits for this role.</p>';

  const rest=TOURS.filter(t=>!t.featured&&matches(t)).sort(byRecent);
  $('list').innerHTML=rest.length?rest.map(t=>`<div class="row"><span class="n">${esc(t.name)}</span><span class="r">${esc(t.role)}</span><span class="w">${esc(t.what)}</span><span class="y">${esc(t.when)}</span></div>`).join(''):'<p class="empty">No other credits for this role.</p>';
}
$('start').innerHTML=VENUES.map(v=>`<div><b>${esc(v.n)}</b><span>${esc(v.p)}. ${esc(v.d)}</span></div>`).join('');
renderFilters();render();
</script>
</body>
</html>
